<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" fill="#090d16" />
  <rect x="20" y="20" width="560" height="300" fill="#000000" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <rect x="20" y="20" width="560" height="32" fill="#0d1117" />
  <circle cx="40" cy="36" r="4" fill="#ff5f56" />
  <circle cx="54" cy="36" r="4" fill="#ffbd2e" />
  <circle cx="68" cy="36" r="4" fill="#27c93f" />
  <text x="90" y="40" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">// Student TDES Workbench (http://127.0.0.1:8082)</text>

  <g transform="translate(40, 70)" font-family="'Fira Code', monospace" font-size="11">
    <!-- Sidebar -->
    <rect x="0" y="0" width="130" height="230" fill="#050810" stroke="rgba(255,255,255,0.08)" />
    <text x="12" y="25" fill="#38bdf8" font-weight="600">STUDENT CONSOLE</text>
    <text x="12" y="55" fill="#f8fafc">📂 lab01-binary-tree</text>
    <text x="24" y="75" fill="#34d399">📄 main.go</text>
    <text x="24" y="95" fill="#94a3b8">📄 tree_test.go</text>
    <text x="24" y="115" fill="#94a3b8">📄 tdes.json</text>
    
    <rect x="10" y="175" width="110" height="36" fill="#0284c7" rx="3" />
    <text x="20" y="197" fill="#ffffff" font-weight="600" font-size="10">SUBMIT LAB ▶</text>

    <!-- Main Editor & Runner Area -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="375" height="150" fill="#000000" stroke="rgba(255,255,255,0.08)" />
      <text x="15" y="25" fill="#ff7b72">package <tspan fill="#ffffff">main</tspan></text>
      <text x="15" y="50" fill="#79c0ff">func <tspan fill="#ffffff">InsertNode</tspan>(root *Node, val int) *Node {</text>
      <text x="35" y="75" fill="#94a3b8">// Implementation verified in student sandbox</text>
      <text x="35" y="95" fill="#79c0ff">return <tspan fill="#ffffff">&amp;Node{Value: val}</tspan></text>
      <text x="15" y="120" fill="#79c0ff">}</text>

      <!-- Local Output Banner -->
      <rect x="0" y="160" width="375" height="70" fill="#052e16" stroke="#16a34a" rx="4" />
      <text x="15" y="185" fill="#4ade80" font-weight="600">✓ Local Verification Passed (3/3 public tests)</text>
      <text x="15" y="210" fill="#94a3b8" font-size="10">Ready to package &amp; encrypt envelope for submission.</text>
    </g>
  </g>
</svg>
