<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" fill="#090d16" rx="0" />
  <rect x="20" y="20" width="560" height="300" fill="#000000" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <!-- Header -->
  <rect x="20" y="20" width="560" height="32" fill="#0d1117" />
  <circle cx="40" cy="36" r="4" fill="#ff5f56" />
  <circle cx="54" cy="36" r="4" fill="#ffbd2e" />
  <circle cx="68" cy="36" r="4" fill="#27c93f" />
  <text x="90" y="40" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">// container-sandbox #01 (isolated)</text>

  <!-- Container graphic -->
  <g transform="translate(40, 75)">
    <!-- Container 1 -->
    <rect x="0" y="0" width="240" height="210" fill="#0a0e17" stroke="#2563eb" stroke-width="1.5" rx="4" />
    <rect x="10" y="10" width="220" height="24" fill="#1e293b" rx="2" />
    <text x="20" y="26" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">docker://tdes-eval:go</text>
    <text x="20" y="60" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">$ euc2 run --mem=512M</text>
    <text x="20" y="85" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">✓ CPU Cgroup: Active</text>
    <text x="20" y="105" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">✓ Net: Disconnected</text>
    <text x="20" y="125" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">✓ ReadOnly RootFS</text>
    <rect x="20" y="150" width="200" height="40" fill="#0284c7" opacity="0.2" rx="4" />
    <text x="30" y="174" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">STATUS: SANDBOXED</text>

    <!-- Container 2 -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="240" height="210" fill="#0a0e17" stroke="#7c3aed" stroke-width="1.5" rx="4" />
      <rect x="10" y="10" width="220" height="24" fill="#1e293b" rx="2" />
      <text x="20" y="26" fill="#c084fc" font-family="'Fira Code', monospace" font-size="11" font-weight="600">docker://tdes-eval:py</text>
      <text x="20" y="60" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">$ euc2 run --mem=256M</text>
      <text x="20" y="85" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">✓ CPU Cgroup: Active</text>
      <text x="20" y="105" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">✓ Net: Disconnected</text>
      <text x="20" y="125" fill="#4ade80" font-family="'Fira Code', monospace" font-size="11">✓ ReadOnly RootFS</text>
      <rect x="20" y="150" width="200" height="40" fill="#7c3aed" opacity="0.2" rx="4" />
      <text x="30" y="174" fill="#c084fc" font-family="'Fira Code', monospace" font-size="11" font-weight="600">STATUS: SANDBOXED</text>
    </g>
  </g>
</svg>
