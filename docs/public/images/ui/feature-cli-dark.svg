<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" fill="#000000" />
  <rect x="20" y="20" width="560" height="300" fill="#070a12" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <rect x="20" y="20" width="560" height="32" fill="#0d1117" />
  <circle cx="40" cy="36" r="4" fill="#334155" />
  <circle cx="54" cy="36" r="4" fill="#334155" />
  <circle cx="68" cy="36" r="4" fill="#334155" />
  <text x="90" y="40" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">// euc2 CLI toolchain (Keyboard-First Productivity)</text>

  <g transform="translate(40, 75)" font-family="'Fira Code', monospace" font-size="11">
    <rect x="0" y="0" width="520" height="210" fill="#000000" stroke="rgba(255,255,255,0.06)" stroke-width="1" rx="4" />
    <text x="20" y="30" fill="#f8fafc" font-weight="600">$ euc2 init go101-lab01 ./workspace</text>
    <text x="20" y="52" fill="#94a3b8">✓ Unpacked student boilerplate template into ./workspace</text>
    
    <text x="20" y="85" fill="#f8fafc" font-weight="600">$ euc2 run --sandbox=docker</text>
    <text x="20" y="107" fill="#34d399">✓ Running 5 public tests in Docker sandbox ... ALL PASSED</text>
    
    <text x="20" y="140" fill="#f8fafc" font-weight="600">$ euc2 submit --drive /Volumes/ExamUSB --student-id STU001</text>
    <text x="20" y="162" fill="#94a3b8">✓ Envelope sealed: STU001_go101_submission.enc (X25519 encrypted)</text>
    
    <rect x="20" y="175" width="240" height="24" fill="#064e3b" opacity="0.6" rx="3" />
    <text x="30" y="191" fill="#34d399" font-weight="600">[DONE] Keyboard-driven flow ready.</text>
  </g>
</svg>
